<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#A8432A">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Estacionamiento San Juan de Dios</title>
<style>
/* Paleta inspirada en las fachadas del barrio de San Juan de Dios, León */
:root{
  --bg:#FBF6EC; --card:#FFFFFF; --soft:#F3EADB; --ink:#2A1A12; --muted:#5E4B3E; --line:#E2D3BD;
  --terra:#A8432A; --terra-soft:#F7E3DA;
  --ocre:#D99A1E; --ocre-soft:#FCEFD2; --ocre-ink:#6B4500;
  --anil:#1F4F94; --anil-soft:#E3EBF7;
  --verde:#2D6E3E; --verde-soft:#E2F0E4;
  --rosa:#C8756C;
  --blue:var(--terra); --blue-soft:var(--terra-soft); --green:var(--verde); --green-soft:var(--verde-soft);
  --red:#A61B1B; --red-soft:#FCEBEA; --amber-soft:var(--ocre-soft); --amber:var(--ocre-ink);
}
.hero{background:var(--terra);color:#fff;margin:calc(-16px - env(safe-area-inset-top)) -16px 18px;padding:calc(22px + env(safe-area-inset-top)) 20px 20px;border-radius:0 0 24px 24px;position:relative;overflow:hidden}
.hero h1{margin:0;font-size:30px;letter-spacing:.01em}
.hero .date{color:#FCE9DF;margin:2px 0 0}
.clock{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:10px}
.clock small{font-size:15px;font-weight:600;color:#FCE9DF;margin-left:6px}
.stripe{display:flex;height:8px;border-radius:999px;overflow:hidden;margin:16px 0 0}
.stripe i{flex:1}
.stripe i:nth-child(1){background:var(--ocre)} .stripe i:nth-child(2){background:var(--rosa)} .stripe i:nth-child(3){background:#FFFFFF} .stripe i:nth-child(4){background:var(--anil)} .stripe i:nth-child(5){background:var(--verde)}
.tile{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;flex:none}
.big .tile svg{width:30px;height:30px;color:#fff}
.k-servicio .tile{background:var(--anil)} .k-cambio .tile{background:var(--ocre)} .k-ganancia .tile{background:var(--verde)}
.k-servicio{border-color:#C9D6EC!important} .k-cambio{border-color:#EED7A4!important} .k-ganancia{border-color:#C3DEC8!important}
.pagehead{border-left:0;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:64px;height:64px;flex:none;border-radius:18px;box-shadow:0 0 0 3px #FBF6EC,0 6px 14px rgba(0,0,0,.25)}
.brand .b1{font-size:16px;font-weight:600;color:#FCE9DF;line-height:1.1}
.brand h1{font-size:27px;line-height:1.15}
.greet{font-size:21px;font-weight:700;margin-top:16px}
.hero .when{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.sec{font-size:20px;font-weight:800;margin:24px 0 10px;display:flex;justify-content:space-between;align-items:center}
.pill{font-size:15px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--verde-soft);color:var(--verde)}
.pill.due{background:var(--ocre-soft);color:var(--ocre-ink)}
.daycard{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:4px 16px}
.ditem{display:flex;gap:14px;align-items:center;width:100%;padding:14px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;font:inherit;color:inherit}
.daycard > :last-child{border-bottom:0}
.chk{width:42px;height:42px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;flex:none;color:var(--muted)}
.chk svg{width:22px;height:22px}
.chk.ok{background:var(--verde);border-color:var(--verde);color:#fff}
.chk.due{border-color:var(--ocre);color:var(--ocre-ink);background:var(--ocre-soft)}
.ditem .grow{flex:1;min-width:0}
.ditem .t{font-weight:700;font-size:19px}
.ditem .m{color:var(--muted);font-size:16px}
.ditem .go{width:22px;height:22px;color:var(--muted);flex:none}
.mini{border:2px solid var(--verde);color:var(--verde);background:var(--card);border-radius:12px;padding:8px 12px;font-size:16px;font-weight:700;min-height:44px;flex:none}
.tiles{display:grid;gap:12px}
.tile2{display:flex;align-items:center;gap:16px;width:100%;padding:16px 18px;border-radius:22px;border:0;color:#fff;text-align:left;min-height:100px;box-shadow:0 4px 0 rgba(42,26,18,.18);transition:transform .12s ease,box-shadow .12s ease}
.tile2:active{transform:translateY(3px) scale(.99);box-shadow:0 1px 0 rgba(42,26,18,.18)}
.tile2.servicio{background:var(--anil)} .tile2.cambio{background:#94640A} .tile2.ganancia{background:var(--verde)}
.tile2 .ic{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.tile2 .ic svg{width:30px;height:30px;color:#fff}
.tile2 .tx{flex:1}
.tile2 .tt{display:block;font-size:22px;font-weight:800;line-height:1.2}
.tile2 .ts{display:block;font-size:16px;opacity:.92;margin-top:2px}
.tile2 .go{width:26px;height:26px;color:#fff;opacity:.85;flex:none}
.recent{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:0 16px}
.undo{margin-top:12px}
.pagehead h1{color:var(--terra)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
main{padding:calc(16px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h1{font-size:28px;margin:4px 0 2px}
.date{color:var(--muted);font-size:18px;margin-bottom:18px}
h2{font-size:21px;margin:30px 0 12px}
.big{display:flex;align-items:center;gap:16px;width:100%;min-height:88px;padding:14px 16px;border:2px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 2px 0 rgba(90,60,30,.08);font-size:22px;font-weight:700;text-align:left;margin-bottom:14px}
.big svg{width:34px;height:34px;flex:none;color:var(--blue)}
.big:active{background:var(--soft)}
.status{font-size:17px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:16px}
.dot{width:12px;height:12px;border-radius:50%;background:#9AA1A9;flex:none}
.dot.ok{background:var(--green)} .dot.warn{background:#C98A00} .dot.err{background:var(--red)}
.note{border-radius:14px;padding:14px 16px;font-size:18px;margin-bottom:16px}
.note.warn{background:var(--amber-soft);color:var(--amber)}
.note.err{background:var(--red-soft);color:var(--red)}
.note.info{background:var(--soft);color:var(--ink)}
.todo{border:2px solid #EED7A4;background:var(--ocre-soft);border-radius:16px;padding:16px;margin-bottom:12px}
h2.pend{color:var(--ocre-ink)}
.todo .t{font-weight:700;font-size:20px}
.todo .m{color:var(--muted);font-size:17px;margin:2px 0 12px}
.btn{display:block;width:100%;min-height:62px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:21px;font-weight:700;padding:12px 16px}
.btn.sec{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.btn.ok{background:var(--green)}
.btn.danger{background:var(--bg);color:var(--red);border:2px solid #E7B9B5}
.btn + .btn{margin-top:12px}
.link{background:none;border:0;color:var(--blue);font-size:18px;text-decoration:underline;padding:14px 0;min-height:48px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{font-weight:600}
.row .m{color:var(--muted);font-size:16px}
.row .amt{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
button.row{width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.empty{color:var(--muted);padding:10px 0}
.nums{display:grid;gap:12px}
.num{background:var(--card);border:2px solid var(--line);border-left:8px solid var(--terra);border-radius:16px;padding:14px 16px}
.num.n-g{border-left-color:var(--verde)} .num.n-c{border-left-color:var(--ocre)} .num.n-p{border-left-color:var(--anil)}
.num .l{font-size:18px;color:var(--muted)}
.num .v{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.say{font-size:20px;margin:0 0 12px}
.hbar{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;margin:10px 0;font-size:18px}
.hbar .track{background:var(--soft);border-radius:8px;height:30px;overflow:hidden;position:relative}
.hbar .fill{height:100%;border-radius:8px}
.bars-c .fill{background:#EBC26E} .bars-c .top .fill{background:var(--ocre)}
.bars-g .fill{background:#9CC6A6} .bars-g .top .fill{background:var(--verde)}
.hbar.top .val{color:#fff}
.hbar .val{position:absolute;right:8px;top:2px;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.hbar.top .lbl{font-weight:800}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:10px 18px;font-size:18px;min-height:52px}
.chip.on{background:var(--terra);border-color:var(--terra);color:#fff}
.chip{background:var(--card)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:16px;border-top:8px solid var(--terra)}
.card.c-g{border-top-color:var(--verde)} .card.c-p{border-top-color:var(--anil)} .card.c-c{border-top-color:var(--ocre)} .card.c-s{border-top-color:var(--rosa)}
.ct{font-size:19px;font-weight:700;color:var(--muted)}
.big-n{font-size:40px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.cmp{font-size:17px;font-weight:700;margin-bottom:10px;color:var(--muted)}
.cmp.up{color:var(--verde)} .cmp.down{color:var(--red)}
.card h3{font-size:19px;margin:22px 0 6px}
.prog{height:16px;background:var(--anil-soft);border-radius:999px;overflow:hidden;margin:8px 0 6px}
.prog span{display:block;height:100%;background:var(--anil);border-radius:999px}
svg.chart{width:100%;height:auto;display:block;margin-top:6px}
.card details{margin-top:10px}
details{border-top:1px solid var(--line);margin-top:24px;padding-top:6px}
summary{font-size:19px;color:var(--blue);padding:14px 0;cursor:pointer;min-height:52px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:3px solid var(--terra);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{border:0;background:none;min-height:74px;font-size:18px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
nav button svg{width:28px;height:28px}
nav button.on{color:var(--blue);font-weight:800}
/* pantalla de captura */
#screen{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(42,26,18,0);visibility:hidden;transition:background .28s ease,visibility 0s linear .32s}
#screen.open{visibility:visible;background:rgba(42,26,18,.5);transition:background .28s ease}
#screen .in{width:100%;max-width:560px;max-height:93vh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(42,26,18,.25);transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.85,.25,1);padding:10px 16px calc(28px + env(safe-area-inset-bottom))}
#screen.open .in{transform:none}
.grab{width:52px;height:6px;border-radius:999px;background:var(--line);margin:4px auto 2px}
.step{animation:stepIn .26s ease both}
@keyframes stepIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.done svg{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
#main.fade{animation:fadeIn .22s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.big,.choice,.btn,.chip,nav button{transition:transform .12s ease,background-color .15s ease,border-color .15s ease}
.big:active,.choice:active,.btn:active,.chip:active{transform:scale(.97)}
nav button:active svg{transform:scale(.9)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.back{background:none;border:0;font-size:20px;color:var(--blue);padding:12px 0;min-height:56px;display:flex;align-items:center;gap:6px}
.q{font-size:26px;font-weight:800;margin:8px 0 18px}
.choice{display:block;width:100%;min-height:68px;padding:14px 18px;margin-bottom:12px;border:2px solid var(--line);border-left:8px solid var(--anil);border-radius:14px;background:var(--card);font-size:21px;font-weight:600;text-align:left}
.choice:active,.choice.sel{border-color:var(--blue);background:var(--blue-soft)}
label{display:block;font-size:19px;font-weight:700;margin:16px 0 6px}
input,textarea{width:100%;font:22px system-ui,sans-serif;padding:14px;border:2px solid #AEB6BF;border-radius:12px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:3px solid var(--blue-soft);border-color:var(--blue)}
input.huge{font-size:34px;font-weight:700;padding:16px}
textarea{min-height:90px;font-size:19px}
.den{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.den label{margin:0;font-size:19px;white-space:nowrap}
.step-n{display:flex;align-items:center;gap:8px;flex:none}
.step-n input{width:64px;text-align:center;font-size:24px;font-weight:700;padding:10px 6px}
.sn{width:48px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:28px;font-weight:700;color:var(--terra);line-height:1}
.sn:active{transform:scale(.94);background:var(--terra-soft)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 4px;padding:16px;border-radius:16px;background:var(--ocre-soft);color:var(--ocre-ink)}
.total span{font-size:20px;font-weight:700}
.total b{font-size:34px;color:var(--ink);font-variant-numeric:tabular-nums}
.denoms{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.denoms label{font-size:17px;margin:6px 0 4px;color:var(--muted)}
.summary{background:var(--soft);border-radius:14px;padding:16px;font-size:20px;margin-bottom:8px}
.summary b{display:block;font-size:22px}
.done{text-align:center;padding:40px 0 10px}
.done svg{width:96px;height:96px;color:var(--green)}
.done .q{text-align:center}
.task{display:grid;grid-template-columns:1fr 56px;gap:8px;margin-bottom:8px}
.task input{font-size:18px;padding:10px 12px}
.x{border:2px solid var(--line);background:#fff;border-radius:12px;font-size:24px;color:var(--muted)}
.small{font-size:16px;color:var(--muted)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:16px;background:var(--soft);padding:2px 6px;border-radius:6px;word-break:break-all}
#toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));background:#111;color:#fff;padding:16px;border-radius:14px;font-size:19px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}
</style>
</head>
<body>
<main id="main"></main>
<nav id="nav">
  <button data-view="inicio" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button data-view="historial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/></svg>Historial</button>
  <button data-view="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumen</button>
</nav>
<div id="screen" role="dialog" aria-modal="true"><div class="in" id="screenIn"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const VER = '1.6.0';
const KEY = 'estac-v1';
const EQ = ['entrada', 'cajero', 'salida'];
const DENOMS = [1, 2, 5, 10, 50];
const denLabel = (d) => d >= 50 ? 'Billetes de $' + d : 'Monedas de $' + d;
const DIAS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const KINDS = { servicio: 1, cambio: 1, ganancia: 1 };
const SVG = (p) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
const ICON = {
  servicio: SVG('<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>'),
  cambio: SVG('<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>'),
  ganancia: SVG('<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>'),
  check: SVG('<circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.2 3.2L17 9"/>'),
  back: SVG('<path d="M15 18l-6-6 6-6"/>'),
  go: SVG('<path d="M9 6l6 6-6 6"/>'),
  ok: SVG('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  clock: SVG('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>')
};

const LOGO = '<svg class="logo" viewBox="0 0 100 100" role="img" aria-label="Logo Estacionamiento San Juan de Dios"><rect width="100" height="100" rx="22" fill="#A8432A"/><rect x="18" y="28" width="8" height="50" rx="2" fill="#FBF6EC"/><rect x="13" y="75" width="18" height="6" rx="2" fill="#FBF6EC"/><rect x="22" y="38" width="66" height="11" rx="4" fill="#D99A1E"/><rect x="34" y="38" width="7" height="11" fill="#FBF6EC"/><rect x="49" y="38" width="7" height="11" fill="#FBF6EC"/><rect x="64" y="38" width="7" height="11" fill="#FBF6EC"/><rect x="79" y="38" width="6" height="11" fill="#FBF6EC"/><g><rect x="12" y="87" width="15.2" height="4" fill="#D99A1E"/><rect x="27.2" y="87" width="15.2" height="4" fill="#C8756C"/><rect x="42.4" y="87" width="15.2" height="4" fill="#FBF6EC"/><rect x="57.6" y="87" width="15.2" height="4" fill="#1F4F94"/><rect x="72.8" y="87" width="15.2" height="4" fill="#2D6E3E"/></g></svg>';
const CFG_V = 2;
function defConfig() {
  const t = (arr) => arr.map(name => ({ name }));
  return {
    v: CFG_V,
    entrada: { name: 'Pluma de entrada', tasks: t(['Recarga de papel de tickets', 'Ajuste de reloj', 'Cambio de batería', 'Limpieza general', 'Reparación / falla', 'Otro']) },
    cajero: { name: 'Cajero', tasks: t(['Ajuste de reloj', 'Cambio de batería', 'Recarga de papel de tickets', 'Limpieza del validador de billetes', 'Limpieza del monedero', 'Atasco de billete o moneda', 'Reparación / falla', 'Otro']) },
    salida: { name: 'Pluma de salida', tasks: t(['Ajuste de reloj', 'Cambio de batería', 'Limpieza general', 'Reparación / falla', 'Otro']) }
  };
}
const IRREGULAR = /reparaci|falla|atasco|^otro$/i;
const median = (a) => { const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

/* ---------- estado ---------- */
function rid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!s || !Array.isArray(s.regs)) s = { regs: [], pend: [] };
  if (!s.config || s.config.v !== CFG_V) { s.config = defConfig(); s.cfgDirty = true; }
  s.pend = s.pend || [];
  s.set = s.set || {};
  if (!/^tel-[a-f0-9]{24}$/.test(s.set.device || '')) {
    const b = new Uint8Array(12); crypto.getRandomValues(b);
    s.set.device = 'tel-' + Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
  }
  return s;
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('No se pudo guardar en el teléfono'); } }
const live = () => S.regs.filter(r => !r.del);

/* ---------- utilidades ---------- */
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mxn = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 });
const money = (n) => mxn.format(Math.round(Number(n) || 0));
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const TZ = 'America/Mexico_City';
const DPF = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
const TPF = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const today = () => DPF.format(new Date()); // fecha de CDMX
const nowTime = () => TPF.format(new Date()); // HH:MM de CDMX
const fmt12 = (t) => { if (!/^\d{2}:\d{2}$/.test(t || '')) return ''; let [h, m] = t.split(':').map(Number); const ap = h < 12 ? 'a.m.' : 'p.m.'; h = h % 12 || 12; return h + ':' + String(m).padStart(2, '0') + ' ' + ap; };
const parse = (s) => new Date(s + 'T12:00:00');
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
const dow = (s) => (parse(s).getDay() + 6) % 7;
const fdate = (s) => { const d = parse(s); return DIAS[dow(s)] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; };
const rel = (s) => { const n = diffDays(today(), s); return n === 0 ? 'Hoy' : n === 1 ? 'Ayer' : fdate(s); };
const eqName = (k) => (S.config[k] && S.config[k].name) || k;
const sum = (arr, f) => arr.reduce((a, r) => a + (Number(r[f]) || 0), 0);
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------- navegación ---------- */
let view = 'inicio';
const H = { kind: 'all' };
const D = { n: 30 };
function go(v) {
  view = v;
  document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x.dataset.view === v));
  render(); window.scrollTo(0, 0);
}
$('#nav').addEventListener('click', (e) => { const b = e.target.closest('button[data-view]'); if (b) go(b.dataset.view); });
function render(quiet) {
  const v = { inicio: vInicio, historial: vHistorial, dash: vDash, ajustes: vAjustes }[view];

/* ---------- estado de conexión, en palabras simples ---------- */
function statusLine() {
  if (!S.set.url) return '';
  let dot = 'ok', txt = 'Todo guardado';
  if (S.syncErr === 'pendiente') { dot = 'warn'; txt = 'Este teléfono aún no tiene permiso'; }
  else if (S.syncErr === 'red') { dot = 'warn'; txt = 'Sin internet. Se guarda cuando regrese.'; }
  else if (S.syncErr) { dot = 'err'; txt = 'Hay un problema de conexión'; }
  else if (S.pend.length || syncing) { dot = 'warn'; txt = 'Guardando…'; }
  return '<div class="status" id="status"><span class="dot ' + dot + '"></span><span>' + txt + '</span></div>';
}
function adminNote() {
  if (!S.set.url) return '<div class="note info">Este teléfono todavía no está conectado. Lo que anote se queda solo aquí.</div>';
  if (S.syncErr === 'pendiente') return '<div class="note warn">Pídele al encargado que dé permiso a este teléfono.<br><span class="small">Código: <span class="mono">' + esc(S.set.device.slice(-6)) + '</span></span></div>';
  if (S.syncErr === 'clave') return '<div class="note err">La clave no es correcta. Revísala en Configuración.</div>';
  if (S.syncErr === 'bloqueado') return '<div class="note err">Se bloqueó por 15 minutos por intentos con clave equivocada.</div>';
  if (S.syncErr === 'configura-clave') return '<div class="note err">Falta poner la clave en la hoja de Google (Codigo.gs).</div>';
  return '';
}

/* ---------- ritmo aprendido de servicios ---------- */
function ritmos() {
  const t = today(), R = live().filter(r => r.kind === 'servicio'), out = [];
  EQ.forEach(k => (S.config[k].tasks || []).forEach(task => {
    if (IRREGULAR.test(task.name.trim())) return;
    const dates = [...new Set(R.filter(r => r.equip === k && r.type === task.name).map(r => r.date))].sort();
    const o = { k, task, n: dates.length, last: dates[dates.length - 1] || null };
    if (dates.length >= 2) {
      const gaps = [];
      for (let i = 1; i < dates.length; i++) gaps.push(diffDays(dates[i], dates[i - 1]));
      o.int = Math.max(1, Math.round(median(gaps.slice(-6))));
      o.next = addDays(o.last, o.int);
      o.left = diffDays(o.next, t);
      o.warn = Math.max(2, Math.round(o.int * 0.15));
    }
    out.push(o);
  }));
  return out.sort((a, b) => (a.left ?? 1e9) - (b.left ?? 1e9));
}
function cuando(p) {
  if (p.int === undefined) return 'Aún aprendiendo';
  if (p.left < 0) return 'Ya se pasó por ' + (-p.left) + (p.left === -1 ? ' día' : ' días');
  if (p.left === 0) return 'Toca hoy';
  if (p.left === 1) return 'Toca mañana';
  return 'Toca en ' + p.left + ' días';
}

/* ---------- vistas ---------- */
function saludo() {
  const h = Number(nowTime().slice(0, 2));
  return (h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches') + (S.set.name ? ', ' + esc(S.set.name.split(' ')[0] === 'Don' || S.set.name.split(' ')[0] === 'Doña' ? S.set.name : S.set.name.split(' ')[0]) : '');
}
function vInicio() {
  const t = today(), R = live(), hoy = R.filter(r => r.date === t);
  const hc = hoy.filter(r => r.kind === 'cambio'), hg = hoy.filter(r => r.kind === 'ganancia');
  const urg = ritmos().filter(p => p.int !== undefined && p.left <= p.warn);
  const hour = Number(nowTime().slice(0, 2));
  let h = '<div class="hero"><div class="brand">' + LOGO + '<div><div class="b1">Estacionamiento</div><h1>San Juan de Dios</h1></div></div>' +
    '<div class="greet">' + saludo() + '</div><div class="when"><div class="clock" id="clock">' + clockStr() + '</div><div class="date">' + fdate(t) + '</div></div>' +
    '<div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>' + statusLine() + adminNote();

  // Tu día: lo que normalmente se hace en un día, con su estado
  const items = [];
  const lastT = (arr) => { const x = arr.slice().sort((a, b) => (b.time || '').localeCompare(a.time || ''))[0]; return x && x.time ? ' · ' + fmt12(x.time) : ''; };
  items.push(hc.length
    ? { ok: true, k: 'cambio', t: 'Cambio al cajero', m: 'Puesto hoy: ' + money(sum(hc, 'monto')) + lastT(hc), act: '<button class="mini" data-new="cambio">+ Más</button>' }
    : { ok: false, k: 'cambio', t: 'Poner cambio al cajero', m: 'Aún no se anota hoy' });
  items.push(hg.length
    ? { ok: true, k: 'ganancia', t: 'Ganancia del día', m: 'Anotada: ' + money(sum(hg, 'monto')) + lastT(hg) }
    : { ok: false, k: 'ganancia', t: 'Anotar la ganancia del día', m: hour >= 18 ? 'Ya es hora de cerrar el día' : 'Se anota al cerrar el día', due: hour >= 18 });
  urg.slice(0, 3).forEach(p => items.push({ ok: false, svc: p, t: esc(eqName(p.k)) + ': ' + esc(p.task.name.toLowerCase()), m: cuando(p) + ' · cada ~' + p.int + ' días', due: true }));
  const done = items.filter(i => i.ok).length;
  h += '<div class="sec"><span>Tu día</span><span class="pill' + (done < items.length ? ' due' : '') + '">' + (done === items.length ? 'Todo listo' : done + ' de ' + items.length + ' listo') + '</span></div><div class="daycard">';
  items.forEach(i => {
    const chk = '<span class="chk' + (i.ok ? ' ok' : i.due ? ' due' : '') + '">' + (i.ok ? ICON.ok : i.svc ? ICON.servicio : ICON.clock) + '</span>';
    const body = '<span class="grow"><div class="t">' + i.t + '</div><div class="m">' + i.m + '</div></span>';
    if (i.svc) h += '<div class="ditem">' + chk + '<span class="grow"><div class="t">' + i.t + '</div><div class="m">' + i.m + '</div><button class="mini" style="margin-top:8px" data-done="' + esc(i.svc.k) + '|' + esc(i.svc.task.name) + '">Ya lo hice hoy</button></span></div>';
    else if (i.ok) h += '<div class="ditem">' + chk + body + (i.act || '') + '</div>';
    else h += '<button class="ditem" type="button" data-new="' + i.k + '">' + chk + body + '<span class="go">' + ICON.go + '</span></button>';
  });
  h += '</div>';

  // Acciones principales
  const tile = (k, tt, ts) => '<button class="tile2 ' + k + '" data-new="' + k + '"><span class="ic">' + ICON[k] + '</span><span class="tx"><span class="tt">' + tt + '</span><span class="ts">' + ts + '</span></span><span class="go">' + ICON.go + '</span></button>';
  h += '<div class="sec"><span>¿Qué quieres anotar?</span></div><div class="tiles">' +
    tile('servicio', 'Un servicio', 'Papel, reloj, batería, limpieza, fallas') +
    tile('cambio', 'Cambio al cajero', 'Monedas y billetes que pusiste') +
    tile('ganancia', 'Ganancia del día', 'Lo que se ganó al cerrar') + '</div>';

  // Lo último
  const ult = sortRegs(R).slice(0, 3);
  if (ult.length) h += '<div class="sec"><span>Lo último</span><button class="link" data-go="historial" style="padding:0;min-height:40px">Ver todo</button></div><div class="recent">' + ult.map(line).join('') + '</div>';
  h += '<div style="margin-top:22px;text-align:center"><button class="link" data-go="ajustes">Configuración</button></div>';
  return h;
}

function line(r) {
  let t, amt = '';
  if (r.kind === 'servicio') t = esc(eqName(r.equip)) + ': ' + esc(r.type);
  else if (r.kind === 'cambio') { t = 'Cambio al cajero'; amt = money(r.monto); }
  else { t = 'Ganancia' + (r.autos ? ' (' + r.autos + ' autos)' : ''); amt = money(r.monto); }
  const m = [rel(r.date) + (r.time ? ', ' + fmt12(r.time) : ''), r.by].filter(Boolean).map(esc).join(' · ');
  return '<button class="row" type="button" data-edit="' + esc(r.id) + '"><span><div class="t">' + t + '</div><div class="m">' + m + '</div></span><span class="amt">' + amt + '</span></button>';
}
function sortRegs(arr) { return arr.slice().sort((a, b) => b.date.localeCompare(a.date) || (b.time || '').localeCompare(a.time || '') || (b.updatedAt || 0) - (a.updatedAt || 0)); }

function vHistorial() {
  let R = live();
  if (H.kind !== 'all') R = R.filter(r => r.kind === H.kind);
  R = sortRegs(R).slice(0, 200);
  const chip = (v, l) => '<button class="chip' + (H.kind === v ? ' on' : '') + '" data-h="' + v + '">' + l + '</button>';
  let h = '<div class="pagehead"><h1>Historial</h1><div class="date">Si algo quedó mal, tócalo para corregirlo o borrarlo.</div></div>';
  h += '<div class="chips">' + chip('all', 'Todo') + chip('servicio', 'Servicios') + chip('cambio', 'Cambio') + chip('ganancia', 'Ganancias') + '</div>';
  return h + (R.length ? R.map(line).join('') : '<div class="empty">Todavía no hay nada anotado aquí.</div>');
}

/* ---------- gráficas ---------- */
const DCORTO = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
const kfmt = (n) => { n = Math.round(Number(n) || 0); return n >= 1000 ? '$' + (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace('.0', '') + 'k' : '$' + n; };
function vbars(data, color, soft, o) {
  o = o || {};
  const W = 340, Hh = 180, pt = 22, pb = 28, n = Math.max(1, data.length);
  const max = Math.max(1, ...data.map(d => d.v), o.avg || 0);
  const bw = W / n, inner = Math.min(38, bw * .72);
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="' + esc(o.label || 'Gráfica') + '">';
  const every = Math.ceil(n / 8);
  data.forEach((d, i) => {
    const h = Math.max(d.v > 0 ? 3 : 0, (Hh - pt - pb) * d.v / max), x = i * bw + (bw - inner) / 2, y = Hh - pb - h;
    const fill = d.hi ? color : (d.est ? soft : color);
    s += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + inner.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="5" fill="' + fill + '"' + (d.est ? ' stroke="' + color + '" stroke-dasharray="4 3" stroke-width="1.5"' : '') + (d.hi === false ? ' opacity=".45"' : '') + '><title>' + esc(d.t || d.s) + ': ' + money(d.v) + '</title></rect>';
    if (o.values && d.v > 0) s += '<text x="' + (x + inner / 2).toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" font-size="12" font-weight="700" text-anchor="middle" fill="#2A1A12">' + kfmt(d.v) + '</text>';
    if (i % every === 0 || n <= 8) s += '<text x="' + (x + inner / 2).toFixed(1) + '" y="' + (Hh - 8) + '" font-size="13" text-anchor="middle" fill="#5E4B3E"' + (d.hi ? ' font-weight="800"' : '') + '>' + esc(d.s) + '</text>';
  });
  if (o.avg) {
    const y = Hh - pb - (Hh - pt - pb) * o.avg / max;
    s += '<line x1="0" x2="' + W + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="#2A1A12" stroke-width="1.5" stroke-dasharray="6 5" opacity=".55"/>';
  }
  return s + '</svg>' + (o.avg ? '<div class="small">- - - Promedio por día: ' + money(o.avg) + '</div>' : '');
}

/* ---------- cálculos para el resumen ---------- */
function porDia(regs) {
  const m = {};
  regs.forEach(r => { const o = m[r.date] = m[r.date] || { g: 0, c: 0, hasG: false }; if (r.kind === 'ganancia') { o.g += Number(r.monto) || 0; o.hasG = true; } if (r.kind === 'cambio') o.c += Number(r.monto) || 0; });
  return m;
}
// Promedio por día de la semana de las últimas 8 semanas. Ganancia: sobre días anotados. Cambio: sobre todos los días.
function patron(byDate) {
  const t = today(), first = Object.keys(byDate).sort()[0];
  if (!first) return null;
  const start = first > addDays(t, -55) ? first : addDays(t, -55);
  const sg = Array(7).fill(0), ng = Array(7).fill(0), sc = Array(7).fill(0), nd = Array(7).fill(0);
  let daysG = 0;
  for (let d = start; d <= t; d = addDays(d, 1)) {
    const w = dow(d), o = byDate[d]; nd[w]++;
    if (o && o.hasG) { sg[w] += o.g; ng[w]++; daysG++; }
    if (o) sc[w] += o.c;
  }
  const allG = sg.reduce((a, b) => a + b, 0) / Math.max(1, daysG);
  return { g: sg.map((v, i) => ng[i] ? v / ng[i] : allG), c: sc.map((v, i) => nd[i] ? v / nd[i] : 0), daysG };
}
function cambioPct(now, prev) {
  if (!prev) return '';
  const p = Math.round((now - prev) / prev * 100);
  if (p === 0) return '<div class="cmp">Igual que el periodo anterior</div>';
  return '<div class="cmp ' + (p > 0 ? 'up' : 'down') + '">' + (p > 0 ? '▲ ' : '▼ ') + Math.abs(p) + '% ' + (p > 0 ? 'más' : 'menos') + ' que el periodo anterior</div>';
}

function vDash() {
  const t = today(), all = live(), byAll = porDia(all);
  const n = D.n || 30, start = addDays(t, -(n - 1)), pStart = addDays(start, -n), pEnd = addDays(start, -1);
  const inR = (a, b) => all.filter(r => r.date >= a && r.date <= b);
  const R = inR(start, t), P = inR(pStart, pEnd);
  const gTot = sum(R.filter(r => r.kind === 'ganancia'), 'monto'), gPrev = sum(P.filter(r => r.kind === 'ganancia'), 'monto');
  const cTot = sum(R.filter(r => r.kind === 'cambio'), 'monto'), cPrev = sum(P.filter(r => r.kind === 'cambio'), 'monto');
  const chip = (v, l) => '<button class="chip' + (n === v ? ' on' : '') + '" data-d="' + v + '">' + l + '</button>';
  let h = '<div class="pagehead"><h1>Resumen</h1><div class="date">Cómo va el estacionamiento.</div></div>';
  h += '<div class="chips">' + chip(7, 'Semana') + chip(30, 'Mes') + chip(90, '3 meses') + '</div>';

  // serie de ganancia
  const step = n > 31 ? 7 : 1, serie = [];
  for (let i = 0; i < n; i += step) {
    let v = 0; const d0 = addDays(start, i);
    for (let j = 0; j < step && i + j < n; j++) { const o = byAll[addDays(start, i + j)]; if (o) v += o.g; }
    const d = parse(d0);
    serie.push({ v, s: n <= 7 ? DCORTO[dow(d0)] : step > 1 ? d.getDate() + '/' + (d.getMonth() + 1) : String(d.getDate()), t: (step > 1 ? 'Semana del ' : '') + fdate(d0) });
  }
  const gDays = R.filter(r => r.kind === 'ganancia').map(r => r.date).filter((v, i, a) => a.indexOf(v) === i).length;
  const avgBar = step > 1 ? 0 : (gDays ? gTot / gDays : 0);
  h += '<section class="card c-g"><div class="ct">Ganancia</div><div class="big-n">' + money(gTot) + '</div>' + cambioPct(gTot, gPrev) +
    (gTot ? vbars(serie, '#2D6E3E', '#9CC6A6', { avg: avgBar, values: n <= 7, label: 'Ganancia por día' }) : '<div class="empty">Aún no hay ganancias anotadas.</div>') + '</section>';

  // proyección
  const pt = patron(byAll);
  h += '<section class="card c-p"><div class="ct">Proyección</div>';
  if (!pt || pt.daysG < 7) {
    h += '<p class="say">Para calcular proyecciones se necesitan al menos 7 días de ganancia anotada.' + (pt ? ' Llevan ' + pt.daysG + '.' : '') + '</p>';
  } else {
    const td = parse(t), mStart = iso(new Date(td.getFullYear(), td.getMonth(), 1)), mEnd = iso(new Date(td.getFullYear(), td.getMonth() + 1, 0));
    const mes = inR(mStart, t), hoyG = byAll[t] && byAll[t].hasG;
    let gMes = sum(mes.filter(r => r.kind === 'ganancia'), 'monto'), cMes = sum(mes.filter(r => r.kind === 'cambio'), 'monto');
    let gProj = gMes, cProj = cMes;
    for (let d = hoyG ? addDays(t, 1) : t; d <= mEnd; d = addDays(d, 1)) { gProj += pt.g[dow(d)]; if (d > t) cProj += pt.c[dow(d)]; }
    const pct = gProj ? Math.min(100, gMes / gProj * 100) : 0;
    h += '<p class="say">Si todo sigue igual, en <b>' + MESES[td.getMonth()] + '</b> se va a ganar cerca de</p><div class="big-n">' + money(gProj) + '</div>' +
      '<div class="prog" aria-hidden="true"><span style="width:' + pct.toFixed(1) + '%"></span></div><div class="small">Van ' + money(gMes) + ' hasta hoy · cambio estimado del mes: ' + money(cProj) + '</div>';
    const next = [];
    for (let i = 1; i <= 7; i++) { const d = addDays(t, i); next.push({ v: pt.c[dow(d)], s: DCORTO[dow(d)], t: fdate(d), est: true }); }
    const mx = Math.max(...next.map(x => x.v));
    if (mx > 0) {
      const top = next.find(x => x.v === mx); top.hi = true; top.est = false;
      h += '<h3>Cambio para los próximos 7 días</h3><p class="say">Ten más cambio listo el <b>' + DIAS[DCORTO.indexOf(top.s)].toLowerCase() + '</b> (cerca de ' + money(mx) + ').</p>' + vbars(next, '#D99A1E', '#FCEFD2', { values: true, label: 'Cambio estimado próximos 7 días' });
    }
    h += '<p class="small">Estimado con el promedio de cada día de la semana de las últimas 8 semanas. Entre más días anoten, más exacto.</p>';
  }
  h += '</section>';

  // cambio por día de la semana
  const cnt = Array(7).fill(0), wc = Array(7).fill(0);
  for (let i = 0; i < n; i++) cnt[dow(addDays(start, i))]++;
  R.filter(r => r.kind === 'cambio').forEach(r => { wc[dow(r.date)] += Number(r.monto) || 0; });
  const ac = wc.map((v, i) => cnt[i] ? v / cnt[i] : 0), mxc = Math.max(...ac);
  h += '<section class="card c-c"><div class="ct">Cambio al cajero</div><div class="big-n">' + money(cTot) + '</div>' + cambioPct(cTot, cPrev);
  if (cTot) h += '<p class="say">El día que más cambio se pone es el <b>' + DIAS[ac.indexOf(mxc)].toLowerCase() + '</b>.</p>' + vbars(ac.map((v, i) => ({ v, s: DCORTO[i], t: DIAS[i], hi: v === mxc ? true : false })), '#D99A1E', '#EBC26E', { values: true, label: 'Cambio promedio por día de la semana' }) + '<p class="small">Promedio por cada día de la semana.</p>';
  else h += '<div class="empty">Aún no hay cambio anotado.</div>';
  h += '</section>';

  // servicios
  const Sv = R.filter(r => r.kind === 'servicio');

function exportCSV() {
  const cols = ['fecha', 'hora', 'registro', 'equipo', 'servicio', 'monto', 'autos', 'costo', 'quien', 'notas'];

/* ---------- sincronización ---------- */
let syncing = false;
function syncInfo() {
  if (!S.set.url) return 'Sin conectar.';
  return (S.lastSync ? 'Última vez: ' + new Date(S.lastSync).toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' }) : 'Aún sin conectar') + (S.pend.length ? ' · ' + S.pend.length + ' por subir' : '');
}
function refreshQuiet() {
  if (scr.classList.contains('open')) return;
  if (view === 'ajustes') { const si = $('#syncInfo'); if (si) si.textContent = syncInfo(); return; }
  render(true);
}
async function sync(manual) {
  const st = S.set;
  if (!st.url || !st.key) { if (manual) toast('Falta la dirección o la clave'); return; }
  if (syncing) return;
  if (!navigator.onLine) { S.syncErr = 'red'; refreshQuiet(); if (manual) toast('Sin internet. Se subirá después.'); return; }
  syncing = true;
  const ops = S.regs.filter(r => S.pend.includes(r.id)).map(r => Object.assign({}, r));
  const body = { action: 'push', key: st.key, device: st.device, deviceName: st.name || '', ops };
  if (S.cfgDirty) body.config = S.config;
  try {
    const res = await fetch(st.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    const j = await res.json();
    if (!j.ok) { S.syncErr = j.error || 'error'; if (manual) toast(j.error === 'pendiente' ? 'Falta dar permiso a este teléfono en la hoja' : j.error === 'clave' ? 'La clave no es correcta' : 'No se pudo conectar'); }
    else {
      const sent = new Map(ops.map(o => [o.id, o.updatedAt]));
      S.pend = S.pend.filter(id => { const r = S.regs.find(x => x.id === id); return r && (!sent.has(id) || r.updatedAt > sent.get(id)); });
      const still = S.regs.filter(r => S.pend.includes(r.id));
      const map = new Map();
      (Array.isArray(j.regs) ? j.regs : []).forEach(r => { if (r && !r.del && KINDS[r.kind] && /^\d{4}-\d{2}-\d{2}$/.test(r.date)) map.set(String(r.id), r); });
      still.forEach(r => { if (r.del) map.delete(r.id); else map.set(r.id, r); });
      S.regs = [...map.values(), ...still.filter(r => r.del)];
      if (body.config) S.cfgDirty = false;
      const okCfg = j.config && j.config.v === CFG_V && EQ.every(k => j.config[k]);
      if (okCfg && !S.cfgDirty) S.config = j.config;
      else if (!okCfg && !body.config) { S.cfgDirty = true; setTimeout(() => sync(), 300); }
      S.lastSync = Date.now(); S.syncErr = '';
      if (manual) toast('Conectado. Todo al día.');
    }
  } catch (e) { S.syncErr = 'red'; if (manual) toast('No se pudo conectar'); }
  syncing = false; save(); refreshQuiet();
}
window.addEventListener('online', () => sync());
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });

}

/* ---------- conexión por enlace ---------- */
const URL_RE = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/;
function connect(url, key) {
  if (!URL_RE.test(url) || !key) return false;
  S.set.url = url; S.set.key = key; S.syncErr = '';

}

  F = { setup: true };
  scrIn.innerHTML = '<div class="grab" aria-hidden="true"></div><div class="q">¡Bienvenido!</div><p>Este teléfono ya quedó conectado.</p><label for="sName">¿Cómo te llamas?</label><input id="sName" type="text" placeholder="Ej. Don José">' +
    '<p class="small">Aparece junto a lo que anotes.</p><button class="btn ok" type="button" id="sOk" style="margin-top:16px">Listo</button>';

}
